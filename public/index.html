<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitser op z'n Bosmans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Nunito:wght@400;700;800&family=Righteous&display=swap" rel="stylesheet">
<meta name="theme-color" content="#04241c">
<style>
  :root{
    --bg:#04241c; --panel:#053b2d; --panel2:#0f4a39; --panel3:#145a46;
    --text:#f2fbf6; --muted:#a9cdbf; --line:#2b7560;
    --amber:#c8e65a; --red:#3bb4f5; --pink:#3bb4f5; --ok:#5fe08f; --bad:#ff5a5a; --cream:#f7fcf3;
    --accent:var(--red); --accent2:var(--amber);
    --chrome:linear-gradient(180deg,#ffffff 0%,#dcdcdc 45%,#a9a9a9 52%,#efefef 100%);
    --neon:linear-gradient(90deg,#3bb4f5,#c8e65a,#14a37a,#3bb4f5,#c8e65a,#14a37a,#3bb4f5);
    --r:18px; --gap:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--text);font:16px/1.5 "Nunito",system-ui,-apple-system,sans-serif;min-height:100vh;background-color:var(--bg);
    background-image:radial-gradient(900px 500px at 50% -10%,#3bb4f530,transparent 70%),radial-gradient(700px 400px at 100% 100%,#c8e65a20,transparent 70%),
      repeating-linear-gradient(90deg,#04271e 0 22px,#03211a 22px 44px)}
  main{max-width:1120px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:var(--gap)}
  h1,h2,h3,button,a.btn{font-family:"Righteous",system-ui,sans-serif;font-weight:400}
  .logo{font-family:"Monoton",cursive;font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.1;margin:0;letter-spacing:2px;color:#f0fff6;
    text-shadow:0 0 6px #3bb4f5,0 0 18px #3bb4f5,0 0 36px #3bb4f5aa}
  .logo small{display:block;font-family:"Righteous",sans-serif;font-size:12px;letter-spacing:6px;text-transform:uppercase;color:var(--amber);text-shadow:0 0 8px #c8e65a99}
  h2{font-size:15px;letter-spacing:2.5px;text-transform:uppercase;color:var(--amber);margin:0 0 14px;text-shadow:0 0 10px #c8e65a55}
  a{color:var(--amber)}
  .muted{color:var(--muted)} .small{font-size:13.5px}
  #error:empty{display:none}
  .panel{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:var(--r);padding:20px;
    border:1px solid #00000080;box-shadow:inset 0 1px 0 #ffffff1f,inset 0 0 0 2px #4f8f7530,0 12px 30px #0009}
  .panel::before{content:"";position:absolute;left:22px;right:22px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--chrome);opacity:.75}
  .panel>:last-child{margin-bottom:0}
  .stack{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row.center{justify-content:center} .row.between{justify-content:space-between}
  .grid{display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr)}
  @media(min-width:860px){.grid.two{grid-template-columns:1fr 1fr}.grid.game{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
  input[type=text],input[type=number],select{height:48px;background:#03221a;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0 14px;
    font:inherit;min-width:0;box-shadow:inset 0 2px 6px #000a}
  input:focus,select:focus{outline:none;border-color:var(--amber);box-shadow:inset 0 2px 6px #000a,0 0 0 3px #c8e65a44}
  input[type=text]{flex:1;width:100%}
  input::placeholder{color:#7fa395}
  input.code{font-family:"Righteous",sans-serif;font-size:22px;letter-spacing:8px;text-transform:uppercase;text-align:center;flex:0 0 140px;width:140px}
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--amber);flex:none}
  button,a.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 20px;border-radius:999px;cursor:pointer;
    font-size:16px;letter-spacing:.4px;white-space:nowrap;text-decoration:none;color:#053b2d;background:var(--chrome);border:1px solid #6d6d6d;
    box-shadow:0 2px 0 #00000080,inset 0 1px 0 #fff;transition:transform .08s,filter .15s}
  button:hover,a.btn:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
  button.primary{background:linear-gradient(180deg,#8fd6fc,#3bb4f5 50%,#1d95d8 51%,#5fc4f8);color:#fff;border-color:#12699c;text-shadow:0 1px 0 #0006;
    box-shadow:0 2px 0 #00000080,0 0 18px #3bb4f566,inset 0 1px 0 #ffffff88}
  button.gold,a.btn.gold{background:linear-gradient(180deg,#e8f6a8,#c8e65a 50%,#a5cb3c 51%,#d6ef7c);color:#0d3b1e;border-color:#6f8a24;
    box-shadow:0 2px 0 #00000080,0 0 18px #c8e65a66,inset 0 1px 0 #fff8}
  button.big{min-height:56px;font-size:19px;padding:0 28px}
  button.wide{width:100%}
  button.link{min-height:0;background:none;border:0;box-shadow:none;padding:2px 4px;color:var(--muted);text-decoration:underline;
    font-family:"Nunito",sans-serif;font-size:14px;letter-spacing:0}
  code{background:#03221a;padding:2px 6px;border-radius:6px;word-break:break-all}
  .err{background:#4a1c1c;border:1px solid var(--bad);padding:12px 14px;border-radius:12px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);margin-right:8px;flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.off{background:var(--bad)}
  .roomcode{font-family:"Righteous",sans-serif;font-size:44px;letter-spacing:10px;color:var(--amber);text-shadow:0 0 14px #c8e65a88;line-height:1.1}
  .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:18px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#ffffff1c}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-size:13px;color:var(--muted);letter-spacing:.3px}
  .field .row{flex-wrap:nowrap}
  .field>input,.field>select{flex:none}
  .setting{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid #ffffff12}
  .setting input[type=number]{width:90px;text-align:center}
  .setting.check{justify-content:flex-start;cursor:pointer}
  ol.steps{padding-left:22px;margin:0} ol.steps li{margin-bottom:10px}
  .plist{display:flex;flex-direction:column;gap:8px}
  .plist .pp{display:flex;align-items:center;gap:8px;background:#03221aaa;border:1px solid #ffffff10;border-radius:12px;padding:0 12px;min-height:50px}
  .plist .pp b{flex:1}
  .pl-list{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#03221a80}
  .pl{display:flex;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid #ffffff10;cursor:pointer}
  .pl:hover{background:#ffffff08} .pl:last-child{border-bottom:0}
  .pl img,.pl .ph{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--panel3);flex:none}
  .pl .t{flex:1;min-width:0}.pl .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .devbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .devbar select{flex:1;min-width:0}
  .devbar button{width:46px;padding:0}
  /* Jukebox-kast */
  .jukebox{position:relative;padding:5px;border-radius:220px 220px 26px 26px;background:var(--neon);background-size:300% 100%;
    animation:neon 8s linear infinite;box-shadow:0 0 28px #3bb4f555,0 0 60px #c8e65a22}
  @keyframes neon{to{background-position:300% 0}}
  .jukebox>.inner{border-radius:215px 215px 21px 21px;background:radial-gradient(ellipse at 50% 0%,#116049 0%,#053b2d 55%,#03221a 100%);
    padding:40px 22px 0;text-align:center;overflow:hidden}
  @media(max-width:600px){.jukebox{border-radius:140px 140px 22px 22px}.jukebox>.inner{border-radius:135px 135px 17px 17px;padding:32px 16px 0}}
  .grille{height:44px;margin:24px -22px 0;border-top:3px solid #cfcfcf;box-shadow:inset 0 6px 10px #000a;
    background:repeating-linear-gradient(90deg,transparent 0 10px,#00000070 10px 12px),linear-gradient(180deg,#0c4232,#021a14)}
  .disc{width:150px;height:150px;margin:0 auto 16px;border-radius:50%;position:relative;
    background:repeating-radial-gradient(circle,#0c0c0c 0 2px,#1e1e1e 2px 4px);border:4px solid #000;box-shadow:0 0 0 3px #ffffff18,0 12px 30px #000c}
  .disc::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 30deg,transparent 0 40deg,#ffffff1e 60deg,transparent 80deg 220deg,#ffffff16 240deg,transparent 260deg)}
  .disc::after{content:"";position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
    background:radial-gradient(circle,#053b2d 0 5px,#3bb4f5 6px 100%);box-shadow:0 0 0 3px #c8e65a}
  .disc.spin{animation:spin 2.2s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cover{width:150px;height:150px;border-radius:14px;object-fit:cover;margin:0 auto 16px;display:block;box-shadow:0 0 0 4px #c8e65a,0 12px 30px #000c}
  .turn{font-family:"Righteous",sans-serif;font-size:clamp(22px,4vw,30px);margin:0;line-height:1.2}
  .sub{color:var(--muted);margin:6px auto 18px;max-width:480px}
  .steps-ind{display:flex;justify-content:center;gap:8px;margin:0 0 14px}
  .steps-ind span{font-family:"Righteous",sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:5px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .steps-ind span.on{background:var(--amber);color:#0d3b1e;border-color:var(--amber);box-shadow:0 0 12px #c8e65a77}
  .steps-ind span.done{color:var(--ok);border-color:var(--ok)}
  .guess-form{max-width:440px;margin:0 auto;text-align:left}
  .controls{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:440px;margin:0 auto}
  .controls .row{justify-content:center;width:100%}
  .controls .row>button{flex:1 1 170px;min-width:0;padding:0 14px}
  .answer{display:grid;grid-template-columns:70px minmax(0,1fr) 28px;gap:8px 12px;align-items:center;max-width:440px;margin:0 auto 16px;text-align:left;
    background:#03221aaa;border:1px solid #ffffff14;border-radius:14px;padding:12px 16px}
  .answer .k{color:var(--muted);font-size:13px}
  .answer .v{font-weight:700;overflow-wrap:anywhere}
  .answer .m{text-align:center;font-weight:800}
  .answer .ok{color:var(--ok)} .answer .bad{color:var(--bad)}
  .answer .cap{grid-column:1/-1;font-family:"Righteous",sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber)}
  .reveal-year{font-family:"Righteous",sans-serif;font-size:58px;line-height:1;color:var(--amber);text-shadow:0 0 18px #c8e65a88}
  .song{font-family:"Righteous",sans-serif;font-size:22px;margin-top:6px;line-height:1.25}
  .verdict{font-family:"Righteous",sans-serif;font-size:22px;margin:12px 0 14px}
  .verdict.ok{color:var(--ok);text-shadow:0 0 12px #5fe08f66} .verdict.bad{color:var(--bad)}
  .reward{margin:0 auto 16px;max-width:440px;min-height:24px}
  /* Tijdlijn: kaarten als jukebox-titelstrookjes */
  .timeline{display:flex;gap:8px;align-items:stretch;overflow-x:auto;padding:6px 4px 14px}
  .card{flex:none;width:124px;min-height:144px;border-radius:10px;display:flex;flex-direction:column;text-align:center;
    background:var(--cream);color:#053b2d;box-shadow:0 6px 14px #0008;overflow:hidden}
  .card .band{height:10px;background:var(--c)}
  .card .body{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:8px;
    background:repeating-linear-gradient(180deg,transparent 0 21px,#d3e7da 21px 22px)}
  .card .y{font-family:"Righteous",sans-serif;font-size:30px;line-height:1;color:#007a5e}
  .card .a{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .n{font-size:12px;font-style:italic;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card.new{box-shadow:0 0 0 4px var(--ok),0 0 22px #5fe08f88}
  .card.wrong{box-shadow:0 0 0 4px var(--bad),0 0 22px #ff5a5a88;opacity:.92}
  .slot{flex:none;width:40px;min-height:144px;border-radius:10px;border:2px dashed #c8e65a66;color:var(--amber);font-size:22px;padding:0;box-shadow:none}
  button.slot{background:transparent;font-family:"Righteous",sans-serif}
  button.slot:hover{border-color:var(--amber);background:#c8e65a14}
  .slot.sel{width:124px;border:3px solid var(--amber);background:#c8e65a1f;font-family:"Righteous",sans-serif;font-size:46px;display:grid;place-items:center;box-shadow:0 0 18px #c8e65a55}
  div.slot:not(.sel){width:12px;border-color:transparent}
  .slot.locked{opacity:.3;pointer-events:none}
  .hint{font-size:13.5px;color:var(--muted);margin:0}
  /* Scorebord */
  .sb{display:flex;flex-direction:column;gap:10px}
  .sb .p{background:#03221aaa;border:1px solid #ffffff10;border-radius:14px;padding:12px 14px}
  .sb .p.cur{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 16px #c8e65a44}
  .sb .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sb .name{display:flex;align-items:center;font-weight:800;min-width:0}
  .sb .name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb .score{font-family:"Righteous",sans-serif;white-space:nowrap}
  .bar{height:8px;background:#0008;border-radius:4px;overflow:hidden;margin:8px 0}
  .bar i{display:block;height:100%;background:var(--neon);background-size:200% 100%}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--cream);color:#053b2d;font-weight:800;border-top:3px solid var(--c)}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#03221af2;color:#fff;padding:12px 18px;border-radius:14px;border:1px solid var(--amber);
    max-width:90vw;display:none;z-index:9;text-align:center;box-shadow:0 0 20px #c8e65a44}
  #offline{position:fixed;top:0;left:0;right:0;background:var(--bad);color:#fff;text-align:center;padding:6px;font-size:14px;display:none;z-index:10}
  .winner{font-family:"Righteous",sans-serif;font-size:clamp(28px,5vw,40px);text-align:center;color:var(--amber);text-shadow:0 0 18px #c8e65a88;margin:0 0 16px}
  .final{text-align:left;margin-bottom:12px}
  .final h3{font-size:16px;margin:0 0 4px}
  label.row{cursor:pointer}
</style>
</head>
<body>
<div id="offline">Verbinding met de server kwijt — opnieuw verbinden…</div>
<main id="app"></main>
<div id="toast"></div>
<script>
/* =========================================================
   Hitser op z'n Bosmans — muziek-tijdlijnspel op afstand
   ========================================================= */
const SCOPES = 'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative';
const REDIRECT = location.origin + location.pathname;

const LS = {
  get(k, d) { try { const v = localStorage.getItem('tm_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tm_' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('tm_' + k); } catch {} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Kleurband per decennium, in het Bosman-palet
const DECADE_COLORS = ['#3bb4f5', '#c8e65a', '#007a5e', '#8fd6fc', '#9ccc3c', '#14a37a'];
const yearColor = y => DECADE_COLORS[Math.floor(y / 10) % DECADE_COLORS.length];
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 4500); }
// Zet HTML alleen opnieuw als de 'sleutel' veranderd is (voorkomt dat invoervelden worden gewist)
function setOnce(el, key, html) { if (el && el.dataset.k !== key) { el.innerHTML = html; el.dataset.k = key; } }

let serverClientId = '';
let clientId = LS.get('clientId', '');
let auth = LS.get('auth', null);
let me = null;                                   // Spotify-profiel
let conn = LS.get('conn', null);                 // {code, token}
let ws = null, queue = [], retry = 0;
let S = null;                                    // spelstatus van de server
let shell = '';
let error = '', busy = '';
let playlists = null, plFilter = '';
let extraPlaylists = LS.get('extraPlaylists', []);
let selected = new Set(LS.get('selPlaylists', []));
let noCompilations = LS.get('noCompilations', true);
let spotifyOn = LS.get('spotifyOn', true);
// Op telefoons/tablets kan de browser zelf geen Spotify afspelen: dan altijd via de Spotify-app.
const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let deviceId = LS.get('deviceId', IS_MOBILE ? '' : 'web');
if (IS_MOBILE && deviceId === 'web') deviceId = '';
let webDeviceId = null, sdkPlayer = null, sdkStatus = 'Browserspeler laden…', devices = [];
let lastPlay = null;
const urlRoom = (new URLSearchParams(location.search).get('room') || '').toUpperCase();

const effClientId = () => serverClientId || S?.clientId || clientId;

/* ---------------- Spotify ---------------- */
function b64url(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
async function spotifyLogin() {
  const id = effClientId();
  if (!id) return toast('Er is nog geen Spotify Client ID ingesteld.');
  clientId = id; LS.set('clientId', id);
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  LS.set('verifier', verifier);
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({ response_type: 'code', client_id: id,
    scope: SCOPES, code_challenge_method: 'S256', code_challenge: challenge, redirect_uri: REDIRECT });
}
async function tokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: clientId, ...params }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.error || ('Tokenfout ' + r.status));
  auth = { access: j.access_token, refresh: j.refresh_token || auth?.refresh, expires: Date.now() + (j.expires_in - 60) * 1000 };
  LS.set('auth', auth);
}
async function handleRedirect() {
  const q = new URLSearchParams(location.search);
  if (q.get('error')) { error = 'Spotify-koppeling afgebroken: ' + q.get('error'); history.replaceState(null, '', REDIRECT); return; }
  const code = q.get('code'); if (!code) return;
  history.replaceState(null, '', REDIRECT);
  await tokenRequest({ grant_type: 'authorization_code', code, redirect_uri: REDIRECT, code_verifier: LS.get('verifier', '') });
}
async function getToken() {
  if (!auth) throw new Error('Niet gekoppeld');
  if (Date.now() > auth.expires) await tokenRequest({ grant_type: 'refresh_token', refresh_token: auth.refresh });
  return auth.access;
}
async function api(path, opts = {}, retried = false) {
  const url = path.startsWith('http') ? path : 'https://api.spotify.com/v1' + path;
  const headers = { Authorization: 'Bearer ' + await getToken() };
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch(url, { ...opts, headers });
  if (r.status === 401 && !retried && auth?.refresh) { auth.expires = 0; return api(path, opts, true); }
  if (r.status === 204 || r.status === 202) return null;
  const text = await r.text(); let j = null; try { j = text ? JSON.parse(text) : null; } catch {}
  if (!r.ok) { const e = new Error(j?.error?.message || text || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return j;
}
function spotifyLogout() {
  auth = null; me = null; playlists = null; LS.del('auth');
  try { sdkPlayer?.disconnect(); } catch {}
  sdkPlayer = null; webDeviceId = null; window._sdkLoading = false;
  syncSpotifyFlag(); render();
}
async function afterSpotifyLogin() {
  try { me = await api('/me'); }
  catch (e) {
    error = e.status === 403 ? 'Dit Spotify-account is nog niet toegevoegd aan de app. Vraag de beheerder om je toe te voegen (Spotify-dashboard → User Management) en koppel daarna opnieuw.'
      : e.status === 401 || e.status === 400 ? 'Spotify-sessie verlopen, koppel opnieuw.' : 'Spotify: ' + e.message;
    auth = null; LS.del('auth'); syncSpotifyFlag(); render(); return;
  }
  error = '';
  if (!IS_MOBILE) initSdk(); else sdkStatus = '';
  refreshDevices(); syncSpotifyFlag(); render();
}

async function loadPlaylists() {
  const out = []; let next = '/me/playlists?limit=50';
  while (next) { const j = await api(next); out.push(...(j.items || []).filter(Boolean)); next = j.next; }
  playlists = out;
}
function parsePlaylistId(s) {
  s = s.trim(); const m = s.match(/playlist[/:]([A-Za-z0-9]{10,})/);
  return m ? m[1] : (/^[A-Za-z0-9]{10,}$/.test(s) ? s : null);
}
function toCard(t) {
  if (!t || t.type !== 'track' || t.is_local || !t.uri || !t.album) return null;
  const y = parseInt((t.album.release_date || '').slice(0, 4), 10);
  if (!y) return null;
  const fixes = LS.get('yearFixes', {});
  return { id: t.id, uri: t.uri, name: t.name, artists: (t.artists || []).map(a => a.name).join(', '),
    year: fixes[t.id] ?? y, album: t.album.name, img: (t.album.images || [])[0]?.url || '',
    comp: t.album.album_type === 'compilation', dur: t.duration_ms || 0 };
}
async function loadPlaylistTracks(id) {
  const out = [];
  async function collect(next) {
    while (next) { const j = await api(next); for (const it of j.items || []) { const c = toCard(it.item || it.track); if (c) out.push(c); } next = j.next; }
  }
  try { await collect(`/playlists/${id}/items?limit=50`); }
  catch (e) { if (e.status === 404 || e.status === 400) { out.length = 0; await collect(`/playlists/${id}/tracks?limit=50`); } else throw e; }
  return out;
}
const playlistName = id => playlists?.find(p => p.id === id)?.name || extraPlaylists.find(p => p.id === id)?.name || id;

function initSdk() {
  if (window._sdkLoading) return; window._sdkLoading = true;
  const create = () => {
    sdkPlayer = new Spotify.Player({ name: 'Hitser op z\'n Bosmans', volume: 0.8, getOAuthToken: cb => getToken().then(cb).catch(() => {}) });
    sdkPlayer.addListener('ready', ({ device_id }) => { webDeviceId = device_id; sdkStatus = ''; renderDevices(); });
    sdkPlayer.addListener('not_ready', () => { webDeviceId = null; sdkStatus = 'Browserspeler is offline.'; renderDevices(); });
    sdkPlayer.addListener('initialization_error', () => { sdkStatus = 'Deze browser kan zelf niet afspelen (bijv. iPhone/Android). Open de Spotify-app, klik 🔄 en kies je telefoon.'; renderDevices(); });
    sdkPlayer.addListener('authentication_error', ({ message }) => { sdkStatus = 'Spotify-fout: ' + message; renderDevices(); });
    sdkPlayer.addListener('account_error', () => { sdkStatus = 'Afspelen vereist Spotify Premium.'; renderDevices(); });
    sdkPlayer.addListener('playback_error', ({ message }) => toast('Afspeelfout: ' + message));
    sdkPlayer.connect();
  };
  if (window.Spotify) return create();
  window.onSpotifyWebPlaybackSDKReady = create;
  const s = document.createElement('script'); s.src = 'https://sdk.scdn.co/spotify-player.js'; document.head.appendChild(s);
}
async function refreshDevices() {
  if (!auth) return;
  try { devices = (await api('/me/player/devices'))?.devices || []; } catch (e) { toast('Apparaten ophalen mislukt: ' + e.message); }
  autoPickDevice();
  renderDevices();
}
// Kies vanzelf een apparaat als het gekozen apparaat er (nog) niet is
function autoPickDevice() {
  const real = devices.filter(d => d.id && d.id !== webDeviceId && !d.is_restricted);
  if (deviceId === 'web' && !IS_MOBILE) return;
  if (deviceId && real.some(d => d.id === deviceId)) return;
  const pick = real.find(d => d.is_active) || real.find(d => /smartphone/i.test(d.type)) || real[0];
  if (pick) { deviceId = pick.id; LS.set('deviceId', deviceId); }
  else if (!IS_MOBILE) deviceId = 'web';
}
const targetDevice = () => deviceId === 'web' ? webDeviceId : deviceId;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const listening = () => !!auth && spotifyOn;

async function playUri(uri, pos) {
  lastPlay = { uri, pos };
  if (!listening()) return;
  const body = JSON.stringify({ uris: [uri], position_ms: pos || 0 });
  const tryPlay = d => api(`/me/player/play${d ? '?device_id=' + encodeURIComponent(d) : ''}`, { method: 'PUT', body });
  let d = targetDevice();
  if (!d) { await refreshDevices(); d = targetDevice(); }
  try {
    if (!d) throw Object.assign(new Error('geen apparaat'), { status: 404 });
    await tryPlay(d);
  } catch (e) {
    if (e.status === 403) return toast('Spotify weigert afspelen. Is dit een Premium-account?');
    if (e.status !== 404) return toast('Afspelen mislukt: ' + e.message);
    // Apparaat ingeslapen of weg: lijst verversen, apparaat 'wakker' maken en opnieuw proberen
    try {
      await refreshDevices(); d = targetDevice();
      if (d && d !== webDeviceId) { await api('/me/player', { method: 'PUT', body: JSON.stringify({ device_ids: [d], play: false }) }).catch(() => {}); await sleep(600); }
      await tryPlay(d);
    } catch (e2) {
      toast(IS_MOBILE ? 'Geen geluid? Tik op "Open Spotify-app", start en pauzeer daar kort een nummer, kom terug en tik op ↻ hier opnieuw afspelen.'
        : 'Spotify-apparaat niet gevonden. Open Spotify, klik 🔄 en kies het opnieuw.');
      renderDevices(); renderStageSafe();
    }
  }
}
function renderStageSafe() { if (S && S.phase !== 'lobby' && $('#stage')) renderStage(); }
// Terug in de browser na de Spotify-app geopend te hebben: apparaten opnieuw ophalen
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && auth) refreshDevices(); });
async function pauseLocal() {
  const d = targetDevice(); if (!listening() || !d) return;
  try { await api(`/me/player/pause?device_id=${encodeURIComponent(d)}`, { method: 'PUT' }); } catch {}
}
function unlockAudio() { try { sdkPlayer?.activateElement?.(); } catch {} }

/* ---------------- Server-verbinding ---------------- */
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => {
    retry = 0; $('#offline').style.display = 'none';
    if (conn) ws.send(JSON.stringify({ type: 'rejoin', code: conn.code, token: conn.token }));
    for (const m of queue.splice(0)) ws.send(JSON.stringify(m));
  };
  ws.onmessage = e => onMessage(JSON.parse(e.data));
  ws.onclose = ev => {
    if (ev.code === 4000) { $('#offline').textContent = 'Dit spel is in een ander tabblad geopend.'; $('#offline').style.display = 'block'; return; }
    $('#offline').style.display = 'block';
    setTimeout(connect, Math.min(5000, 400 * 2 ** retry++));
  };
}
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); else queue.push(m); }

function onMessage(m) {
  switch (m.type) {
    case 'joined':
      conn = { code: m.code, token: m.token }; LS.set('conn', conn);
      history.replaceState(null, '', REDIRECT);
      if (clientId && !serverClientId) send({ type: 'setClientId', clientId });
      break;
    case 'state': {
      const prevPhase = S?.phase;
      S = m;
      if (S.clientId && !clientId) { clientId = S.clientId; LS.set('clientId', clientId); }
      syncSpotifyFlag();
      if (prevPhase !== S.phase && S.phase === 'lobby' && S.host === S.you && auth && !playlists) loadPlaylists().then(renderPlaylistList).catch(() => {});
      render(); break;
    }
    case 'play': playUri(m.uri, m.pos); break;
    case 'pause': pauseLocal(); break;
    case 'toast': toast(m.msg); break;
    case 'error':
      if (m.fatal) { conn = null; LS.del('conn'); S = null; render(); }
      toast(m.msg); break;
  }
}
function syncSpotifyFlag() {
  if (!S) return;
  const mine = S.players.find(p => p.id === S.you);
  if (mine && mine.spotify !== listening()) send({ type: 'setSpotify', on: listening() });
}

const activePlayer = () => S?.players[S.turn];

async function startGame() {
  error = '';
  if (!selected.size) { error = 'Kies minstens één playlist.'; return render(); }
  busy = 'Nummers laden…'; renderHostPanel(true);
  try {
    let all = [];
    for (const id of selected) {
      busy = `Laden: ${playlistName(id)}…`; renderHostPanel(true);
      try { all.push(...await loadPlaylistTracks(id)); }
      catch (e) {
        throw new Error(`Playlist "${playlistName(id)}" kon niet geladen worden (${e.status || ''} ${e.message}).` +
          (e.status === 403 ? ' Spotify laat hobby-apps vaak alleen playlists lezen die je zelf hebt gemaakt of waaraan je meewerkt. Kopieer de playlist naar je eigen account.' : ''));
      }
    }
    const seen = new Set();
    let deck = all.filter(c => {
      const k = (c.name.replace(/\s*[-(].*(remaster|version|edit|live|mono|stereo).*$/i, '') + '|' + c.artists).toLowerCase();
      if (seen.has(c.id) || seen.has(k)) return false; seen.add(c.id); seen.add(k); return true;
    });
    const total = deck.length;
    if (noCompilations) deck = deck.filter(c => !c.comp);
    if (deck.length < S.players.length * 2 + 3) throw new Error(`Te weinig bruikbare nummers (${deck.length} van ${total}).` + (noCompilations ? ' Zet "verzamelalbums overslaan" uit of kies meer playlists.' : ' Kies meer playlists.'));
    send({ type: 'start', deck: deck.map(({ comp, ...c }) => c) });
  } catch (e) { error = e.message; }
  busy = ''; render(); renderHostPanel(true);
}

function timelineHTML(p) {
  let h = ''; const act = canAct(), locked = !S.guess;
  for (let i = 0; i <= p.cards.length; i++) {
    if (S.phase === 'listen') {
      const sel = S.slot === i;
      h += act ? `<button class="slot ${sel ? 'sel' : ''} ${locked ? 'locked' : ''}" data-act="slot" data-i="${i}" ${locked ? 'disabled' : ''}>${sel ? '?' : '+'}</button>`
               : `<div class="slot ${sel ? 'sel' : ''}">${sel ? '?' : ''}</div>`;
    } else if (S.phase === 'reveal' && S.slot === i) h += cardHTML(S.current, S.correct ? 'new' : 'wrong');
    if (i < p.cards.length) h += cardHTML(p.cards[i]);
  }
  return `<div class="timeline">${h}</div>`;
}

  if (draft.key !== turnKey) draft = { key: turnKey, artist: '', title: '' };
  const replay = listening() && lastPlay && S.phase !== 'over' ? `<p style="margin:12px 0 0"><button class="link" data-act="replay">↻ hier opnieuw afspelen</button></p>` : '';
  const playBtn = S.playing ? `<button data-act="pause">⏸ Pauze</button>` : `<button class="gold" data-act="play">▶ Speel nummer</button>`;
  let html;

  if (S.phase === 'over') {
    html = `<div class="winner">🏆 ${esc(S.winner)} wint!</div>
      ${S.players.map(p => `<div class="final"><h3>${esc(p.name)} · ${p.cards.length} kaarten</h3><div class="timeline">${p.cards.map(c => cardHTML(c)).join('')}</div></div>`).join('')}
      <div class="row center">${isHost() ? `<button class="primary big" data-act="newGame">Nieuw spel</button>` : '<span class="muted">Wachten tot de spelleider een nieuw spel start…</span>'}</div>`;
  } else if (S.phase === 'listen') {
    const step = S.guess ? 2 : 1;
    const who = mine ? 'Jij bent aan de beurt!' : `${esc(ap.name)} is aan de beurt`;
    html = `<div class="steps-ind"><span class="${step === 1 ? 'on' : 'done'}">${step === 1 ? '1' : '✔'} · Raad</span><span class="${step === 2 ? 'on' : ''}">2 · Plaats</span></div>
      <div class="disc ${S.playing ? 'spin' : ''}"></div>
      <p class="turn">${who}</p>`;
    if (act && !S.guess) {
      html += `<p class="sub">${mine ? 'Luister goed. Welke artiest en welk nummer hoor je?' : `Jij bent de spelleider en kunt namens ${esc(ap.name)} invullen.`}</p>
        <div class="guess-form">
          <div class="field"><label for="gArtist">Artiest</label><input type="text" id="gArtist" maxlength="80" autocomplete="off" autocapitalize="words" placeholder="Wie zingt dit?" value="${esc(draft.artist)}"></div>
          <div class="field"><label for="gTitle">Titel</label><input type="text" id="gTitle" maxlength="120" autocomplete="off" placeholder="Hoe heet het nummer?" value="${esc(draft.title)}"></div>
        </div>
        <div class="controls">
          <div class="row">${playBtn}<button class="primary" data-act="submitGuess">Bevestig antwoord</button></div>
          <button class="link" data-act="noGuess">Ik heb geen idee, ga door naar plaatsen</button>
        </div>`;
    } else if (act) {
      html += `<p class="sub">Leg het nummer nu op de juiste plek in ${mine ? 'je' : 'de'} tijdlijn hieronder.</p>
        ${answerHTML(mine ? 'Jouw antwoord' : 'Antwoord van ' + esc(ap.name), S.guess)}
        <div class="controls">
          <div class="row">${playBtn}<button class="primary" data-act="confirm" ${S.slot == null ? 'disabled' : ''}>Bevestig plek</button></div>
          <div class="row"><button data-act="skip" ${ap.tokens < 1 ? 'disabled' : ''}>Ander nummer · 1 🪙</button>
            <button data-act="buy" ${ap.tokens < 3 ? 'disabled' : ''}>Koop kaart · 3 🪙</button></div>
        </div>`;
    } else {
      html += `<p class="sub">${S.guess ? `${esc(ap.name)} heeft geraden. Kijk mee waar het nummer komt…` : `${esc(ap.name)} denkt na over artiest en titel… Weet jij het?`}
        <br>${S.playing ? '🎵 Het nummer speelt' : 'Het nummer staat stil'}</p>
        ${S.guess ? answerHTML('Antwoord van ' + esc(ap.name), S.guess) : ''}`;
    }
    html += replay;
  } else {
    const c = S.current, g = S.guess || {}, r = S.guessResult;
    const both = r && r.artist && r.title;
    const canOverride = !S.guessed && (g.artist || g.title) && (!mine || S.players.length === 1 || isHost());
    const reward = S.guessed ? `<span style="color:var(--ok);font-weight:800">${both ? '+1 🪙 voor artiest én titel!' : '+1 🪙, toch goed gerekend'}</span>`
      : canOverride ? `<button class="link" data-act="guessed">Antwoord bijna goed? Reken het toch goed (+1 🪙)</button>`
      : `<span class="hint">Artiest én titel goed levert een munt op.</span>`;
    html = `${c.img ? `<img class="cover" src="${esc(c.img)}" alt="">` : '<div class="disc"></div>'}
      <div class="reveal-year">${c.year}</div>
      <div class="song">${esc(c.name)}</div>
      <div class="muted">${esc(c.artists)} · <span class="small">${esc(c.album)}</span></div>
      <div class="verdict ${S.correct ? 'ok' : 'bad'}">${S.correct ? '✔ Goed geplaatst!' : '✘ Helaas, verkeerde plek'}</div>
      ${answerHTML(mine ? 'Jouw antwoord' : 'Antwoord van ' + esc(ap.name), g, r || { artist: false, title: false })}
      <div class="reward">${reward}</div>
      <div class="controls">
        ${act ? `<div class="row">${S.playing ? '<button data-act="pause">⏸ Pauze</button>' : '<button data-act="play">▶ Verder luisteren</button>'}
          <button class="primary" data-act="next">Volgende beurt →</button></div>` : ''}
        ${isHost() ? `<button class="link" data-act="fixYear">Jaartal klopt niet? Pas het aan</button>` : ''}
      </div>`;
  }

  // Alleen vervangen als er echt iets veranderd is; focus en cursor in invoervelden behouden
  if (el.dataset.k === html) return;
  const a = document.activeElement, fid = a && el.contains(a) ? a.id : null;
  const sel = fid ? [a.selectionStart, a.selectionEnd] : null;
  el.innerHTML = html; el.dataset.k = html;
  if (fid && $('#' + fid)) { const n = $('#' + fid); n.focus(); try { n.setSelectionRange(...sel); } catch {} }
}

function renderMusic() {
  const el = $('#music'); if (!el) return;
  const id = effClientId();
  const key = [!!auth, me?.id, spotifyOn, id, isHost()].join('|');
  let html;
  if (!id) {
    html = `<h2>🔊 Muziek</h2>` + (isHost() ? `<p class="muted small">Om met Spotify te spelen heb je eenmalig een Spotify-ontwikkelaarsapp nodig:</p>
      <ol class="steps small">
        <li>Ga naar <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">developer.spotify.com/dashboard</a> en klik <b>Create app</b>. Vink <b>Web API</b> en <b>Web Playback SDK</b> aan.</li>
        <li>Redirect URI: <code>${esc(REDIRECT)}</code> <button class="link" data-act="copyRedirect">kopieer</button></li>
        <li>Plak de <b>Client ID</b> hier:</li></ol>
      <div class="row"><input type="text" id="clientIdInput" placeholder="Client ID"><button class="primary" data-act="saveClientId">Opslaan</button></div>`
      : `<p class="muted">De spelleider heeft Spotify nog niet ingesteld. Je kunt meeluisteren via het videogesprek.</p>`);
  } else if (!auth) {
    html = `<h2>🔊 Muziek horen</h2>
      ${isHost() ? `<p>Koppel als spelleider je Spotify om playlists te kiezen en muziek af te spelen.</p>
        <p class="small muted">Deel daarna in jullie videogesprek (Discord, Meet, Zoom…) je scherm <b>met geluid</b>, zodat spelers zonder Spotify meeluisteren.</p>`
      : `<p class="muted">Je luistert mee via het geluid dat de spelleider deelt in het videogesprek.</p>
        <p class="small muted">Heb je Spotify Premium en heeft de spelleider jouw account toegevoegd aan de app? Dan kun je de muziek ook rechtstreeks op je eigen apparaat horen.</p>`}
      <button class="${isHost() ? 'primary' : ''}" data-act="spotifyLogin">Koppel Spotify</button>`;
  } else {
    html = `<h2>🔊 Muziek</h2>
      <p class="small" style="margin-top:0">Spotify gekoppeld: <b>${esc(me?.display_name || me?.id || '…')}</b> <button class="link" data-act="spotifyLogout">ontkoppelen</button></p>
      <label class="row" style="margin-bottom:8px"><input type="checkbox" id="spotifyOn" ${spotifyOn ? 'checked' : ''}> Speel de nummers af op dit apparaat</label>
      <div id="devices"></div>`;
  }
  setOnce(el, key, html);
  renderDevices();
}

function renderDevices() {
  const el = $('#devices'); if (!el) return;
  if (!spotifyOn) { setOnce(el, 'off', '<p class="small muted">Je hoort de muziek nu niet via Spotify.</p>'); return; }
  const real = devices.filter(d => d.id && d.id !== webDeviceId);
  const opts = (IS_MOBILE ? [] : [`<option value="web" ${deviceId === 'web' ? 'selected' : ''}>Deze browser${webDeviceId ? '' : ' (niet klaar)'}</option>`])
    .concat(real.map(d => `<option value="${esc(d.id)}" ${deviceId === d.id ? 'selected' : ''}>${esc(d.name)} (${esc(d.type)})</option>`));
  if (deviceId && deviceId !== 'web' && !real.some(d => d.id === deviceId)) opts.push(`<option value="${esc(deviceId)}" selected>Eerder gekozen apparaat</option>`);
  if (!opts.length) opts.push('<option value="">Nog geen apparaat gevonden</option>');
  const dh = IS_MOBILE
    ? `<div class="small" style="margin-bottom:8px"><b>Op je telefoon komt het geluid uit de Spotify-app:</b>
        <ol class="small" style="margin:6px 0;padding-left:20px">
          <li>Tik op <b>Open Spotify-app</b>, start daar een nummer en pauzeer het meteen.</li>
          <li>Kom terug naar dit scherm; je telefoon wordt dan vanzelf gekozen.</li></ol></div>
      <div class="devbar"><a href="spotify:" class="btn gold">Open Spotify-app</a>
        <select id="device">${opts.join('')}</select><button data-act="refreshDevices" title="Apparaten verversen">🔄</button></div>
      <p class="small muted" style="margin-bottom:0">Leg je telefoon omgekeerd neer, anders zie je de titel 🙈</p>`
    : `<div class="devbar">Afspelen op <select id="device">${opts.join('')}</select>
        <button data-act="refreshDevices" title="Apparaten verversen">🔄</button></div>
      ${deviceId === 'web' && sdkStatus ? `<div class="small muted" style="margin-top:4px">${esc(sdkStatus)}</div>` : ''}`;
  setOnce(el, dh, dh);   // alleen vervangen bij wijziging, zodat een open keuzelijst niet dichtklapt
}

function renderHostPanel(force) {
  const el = $('#hostPanel'); if (!el) return;
  const host = isHost();
  const key = [host, !!auth, playlists ? playlists.length : -1, busy].join('|');
  if (!host) { setOnce(el, key, `<div class="panel"><p class="muted" style="margin:0;text-align:center">🎶 Wachten tot de spelleider de jukebox aanzet…</p></div>`); return; }
  if (force) el.dataset.k = '';
  const s = S.settings;
  setOnce(el, key, `<div class="grid two">
    <div class="panel"><h2>Playlists</h2>
      ${!auth ? '<p class="muted">Koppel eerst Spotify (hierboven) om jullie playlists te kiezen.</p>' : `
        <div class="row" style="margin-bottom:10px"><input type="text" id="plFilter" placeholder="Zoeken in je playlists…" value="${esc(plFilter)}"></div>
        <div class="pl-list" id="plList"><div class="pl muted">Playlists laden…</div></div>
        <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input type="text" id="plLink" placeholder="…of plak een playlistlink"><button data-act="addLink">Toevoegen</button></div>
        <p class="hint" id="selCount" style="margin-top:10px"></p>`}
    </div>
    <div class="panel"><h2>Instellingen</h2>
      <div class="setting"><label for="sTarget">Kaarten om te winnen</label><input type="number" id="sTarget" min="3" max="30" data-setting="target" value="${s.target}"></div>
      <div class="setting"><label for="sTokens">Startmunten per speler</label><input type="number" id="sTokens" min="0" max="10" data-setting="tokens" value="${s.tokens}"></div>
      <label class="setting check row"><input type="checkbox" data-setting="skipIntro" ${s.skipIntro ? 'checked' : ''}> Intro overslaan</label>
      <label class="setting check row" style="border-bottom:0;margin-bottom:12px"><input type="checkbox" id="noComp" ${noCompilations ? 'checked' : ''}> Verzamelalbums overslaan (vaak een fout jaartal)</label>
      <button class="primary big wide" data-act="start" ${!auth || busy ? 'disabled' : ''}>${busy ? esc(busy) : 'Start spel ▶'}</button>
    </div></div>`);
  renderPlaylistList();
}

function renderPlaylistList() {
  const el = $('#plList'); if (!el) return;
  const sc = $('#selCount');
  if (sc) sc.textContent = selected.size ? `${selected.size} gekozen: ${[...selected].map(playlistName).join(', ')}` : 'Nog geen playlist gekozen.';
  if (!playlists) return;
  const all = [...extraPlaylists.map(p => ({ ...p, extra: true })), ...playlists];
  const list = all.filter(p => !plFilter || (p.name || '').toLowerCase().includes(plFilter));
  el.innerHTML = list.length ? list.map(p => {
    const img = p.images?.[p.images.length - 1]?.url || p.images?.[0]?.url;
    const count = p.tracks?.total ?? p.items?.total;
    return `<div class="pl" data-act="togglePl" data-id="${esc(p.id)}"><input type="checkbox" ${selected.has(p.id) ? 'checked' : ''} tabindex="-1">
      ${img ? `<img src="${esc(img)}" alt="">` : '<div class="ph"></div>'}
      <div class="t"><b>${esc(p.name)}</b><span class="small muted">${p.extra ? 'via link' : [count != null ? count + ' nummers' : '', p.owner?.display_name ? 'van ' + esc(p.owner.display_name) : ''].filter(Boolean).join(' · ')}</span></div></div>`;
  }).join('') : '<div class="pl muted">Geen playlists gevonden.</div>';
}

/* ---------------- Opstarten ---------------- */
(async () => {
  try { serverClientId = (await (await fetch('/config')).json()).clientId || ''; } catch {}
  if (serverClientId) clientId = serverClientId;
  try { await handleRedirect(); } catch (e) { error = 'Spotify koppelen mislukt: ' + e.message; }
  if (urlRoom && conn && conn.code !== urlRoom) { conn = null; LS.del('conn'); }  // uitnodiging voor een andere kamer
  render();
  connect();
  if (auth) afterSpotifyLogin().then(() => { if (isHost()) loadPlaylists().then(() => renderHostPanel()).catch(e => toast('Playlists laden mislukt: ' + e.message)); });
})();
</script>
</body>
</html>
